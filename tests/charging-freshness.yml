# Build-only fixture: dummy vehicle identity and no access to a real house.
substitutions:
  device_name: charging-freshness-test
  friendly_name: Charging Freshness Test
  ble_mac_address: "AA:BB:CC:DD:EE:FF"
  tesla_vin: "5YJ3E1EA4JF000001"
  charging_amps_max: "16"
  ble_presence_timeout: 30s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  libraries:
    - TeslaBLE=https://github.com/PedroKTFC/tesla-ble.git

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
  homeassistant_services: true
wifi:
  ssid: "test-network"
  password: "test-password"
external_components:
  - source: ../components
    components: [tesla_ble_vehicle]
packages:
  common: !include ../packages/common.yml
  project: !include ../packages/project.yml
  client: !include ../packages/client.yml
  charging_freshness: !include ../packages/charging-freshness.yml
